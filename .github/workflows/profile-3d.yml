name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Remove language donut chart
        run: |
          python3 -c '
          import glob, re
          for file in glob.glob("profile-3d-contrib/*.svg"):
              with open(file, "r", encoding="utf-8") as f:
                  content = f.read()
              # Match and remove the donut and legend group based on coordinates
              content = re.sub(r"<g[^>]*transform=\"translate\([0-9\s.,-]+\)\"[^>]*>.*?<text[^>]*>C</text>.*?</g>", "", content, flags=re.DOTALL)
              with open(file, "w", encoding="utf-8") as f:
                  f.write(content)
          '

      - name: Commit and push 3D SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git commit -m "chore: regenerate 3d calendar without donut" || exit 0
          git push
          