name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *" # Daily midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Strip language donut from SVGs
        run: |
          python3 -c '
          import glob, re

          for path in glob.glob("profile-3d-contrib/*.svg"):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              # Removes the donut pie-chart paths and language legend
              cleaned = re.sub(r"<g[^>]*class=\"pie-lang\"[^>]*>.*?</g>", "", content, flags=re.DOTALL)
              if cleaned == content:
                  # Fallback pattern for inline coordinate-based group
                  cleaned = re.sub(r"<g[^>]*transform=\"translate\([0-9\s.,-]+\)\"[^>]*>.*?<path[^>]*d=\"M.*?A.*?Z\"[^>]*>.*?</g>", "", content, flags=re.DOTALL)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(cleaned)
          '

      - name: Commit and push 3D SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git commit -m "chore: strip language donut from 3d skyline" || exit 0
          git push
          